name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches: [main]           # запускается при каждом push в main
  workflow_dispatch:           # позволяет запустить вручную из GitHub UI

permissions:
  contents: write              # нужно для записи в gh-pages ветку

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout source
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: portfolio/package-lock.json

      - name: 📦 Install dependencies
        run: npm ci
        working-directory: portfolio

      - name: 🔨 Build
        run: npm run build
        working-directory: portfolio

      - name: 🚀 Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: portfolio/dist   # содержимое dist/ идёт в корень gh-pages ветки
          publish_branch: gh-pages
